spring.application.name=WebDiary
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webdiary}
spring.datasource.username=${DB_USER:webdiary}
spring.datasource.password=${DB_PASSWORD:webdiary}